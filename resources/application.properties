spring.application.name=shoppingapp
server.port=8080
server.address=0.0.0.0

# ---------------- 数据库 ----------------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/shopping_db?useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=root

# ---------------- MyBatis-Plus ----------------
# 数据库的 created_at 自动映射成 Java 的 createdAt
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 控制台打印执行的 SQL，方便调试
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto

# ---------------- 订单 ----------------
# 已支付订单还能取消的时间窗口,待支付订单不受这个限制
# 改成 30 就是半小时，改成 0 就是支付后立刻不能取消，改成 1440 就是一整天
shop.order.cancel-window-minutes=60
