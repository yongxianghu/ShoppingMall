<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>蓝汐商城 · 登录</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app-header"></div>

<main class="wrap login-wrap">
  <div class="login-box">
    <h2 id="title">欢迎回来</h2>
    <div class="tip" id="tip">登录后就能加购物车、下单啦</div>

    <div class="tabs">
      <div class="on" id="tabLogin">登录</div>
      <div id="tabRegister">注册</div>
    </div>

    <form id="form" autocomplete="off">
      <div class="field">
        <label>用户名</label>
        <input id="username" placeholder="3-20 个字符">
        <div class="err" id="errUsername"></div>
      </div>
      <div class="field">
        <label>密码</label>
        <input id="password" type="password" placeholder="至少 6 位">
        <div class="err" id="errPassword"></div>
      </div>
      <div class="field hidden" id="confirmField">
        <label>确认密码</label>
        <input id="confirm" type="password" placeholder="再输一次">
        <div class="err" id="errConfirm"></div>
      </div>
      <div class="field hidden" id="nicknameField">
        <label>昵称（可不填）</label>
        <input id="nickname" placeholder="给自己起个名字">
      </div>
      <button class="btn-primary" id="submitBtn" type="submit">登录</button>
    </form>
  </div>
</main>

<div id="app-footer"></div>

<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/login.js"></script>
</body>
</html>
